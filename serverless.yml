service: thought-recorder

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-northeast-2
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 29

  environment:
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY}
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}
    LOG_LEVEL: ${opt:log-level, 'info'}
    AI_MODEL: claude-sonnet-4-20250514
    AI_MAX_TOKENS: 300

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt ThoughtRecordsTable.Arn
            - !Sub "${ThoughtRecordsTable.Arn}/index/*"

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node20
    exclude:
      - '@aws-sdk/*'

functions:
  kakaoSkill:
    handler: src/handlers/kakao.handler
    description: 카카오 오픈빌더 스킬 서버
    events:
      - http:
          path: /kakao/skill
          method: post
          cors: true
    environment:
      FUNCTION_NAME: kakaoSkill

resources:
  Resources:
    ThoughtRecordsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
          - AttributeName: dateKey
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: byDate
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: dateKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Project
            Value: thought-recorder
          - Key: Environment
            Value: ${self:provider.stage}

  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
    DynamoDBTable:
      Description: DynamoDB Table Name
      Value: !Ref ThoughtRecordsTable
